<svg xmlns="http://www.w3.org/2000/svg" width="400" height="40" viewBox="0 0 400 40" role="img" aria-labelledby="title">
<title id="title">Backend · APIs · Integraciones</title>
<style>
  .cycling { display:none; }
  .slot { opacity:0; animation:slot 12s linear infinite; }
  .reveal { width:0; animation:reveal 12s infinite; }
  .cursor-position { animation:cursor-position 12s infinite; }
  .cursor { animation:blink 1s steps(1,end) infinite; }
  @keyframes slot { 0%,33.32% { opacity:1; } 33.33%,100% { opacity:0; } }
  @keyframes reveal {
    0% { width:0; animation-timing-function:steps(var(--letters),end); }
    9%,26% { width:var(--word-width); animation-timing-function:steps(var(--letters),end); }
    31%,100% { width:0; }
  }
  @keyframes cursor-position {
    0% { transform:translateX(0); animation-timing-function:steps(var(--letters),end); }
    9%,26% { transform:translateX(var(--word-width)); animation-timing-function:steps(var(--letters),end); }
    31%,100% { transform:translateX(0); }
  }
  @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  @supports (animation-name:slot) {
    @media (prefers-reduced-motion:no-preference) {
      .static-label { display:none; }
      .cycling { display:inline; }
    }
  }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>
<g fill="#424a53" font-family="Consolas,ui-monospace,monospace" font-size="19">
<text class="static-label" x="200" y="26" text-anchor="middle" font-size="16">Backend · APIs · Integraciones</text>
<g class="cycling">
<g class="slot" style="--letters:7;--word-width:79.8px;animation-delay:0s">
<defs><clipPath id="word-0"><rect class="reveal" x="160.1" y="0" height="40" style="animation-delay:0s"/></clipPath></defs>
<text x="160.1" y="26" textLength="79.8" lengthAdjust="spacingAndGlyphs" clip-path="url(#word-0)">Backend</text>
<g class="cursor-position" style="animation-delay:0s"><rect class="cursor" x="163.1" y="10" width="1.5" height="20" rx=".5" fill="#238636"/></g>
</g>
<g class="slot" style="--letters:4;--word-width:45.6px;animation-delay:-8s">
<defs><clipPath id="word-1"><rect class="reveal" x="177.2" y="0" height="40" style="animation-delay:-8s"/></clipPath></defs>
<text x="177.2" y="26" textLength="45.6" lengthAdjust="spacingAndGlyphs" clip-path="url(#word-1)">APIs</text>
<g class="cursor-position" style="animation-delay:-8s"><rect class="cursor" x="180.2" y="10" width="1.5" height="20" rx=".5" fill="#238636"/></g>
</g>
<g class="slot" style="--letters:13;--word-width:148.2px;animation-delay:-4s">
<defs><clipPath id="word-2"><rect class="reveal" x="125.9" y="0" height="40" style="animation-delay:-4s"/></clipPath></defs>
<text x="125.9" y="26" textLength="148.2" lengthAdjust="spacingAndGlyphs" clip-path="url(#word-2)">Integraciones</text>
<g class="cursor-position" style="animation-delay:-4s"><rect class="cursor" x="128.9" y="10" width="1.5" height="20" rx=".5" fill="#238636"/></g>
</g>
</g></g></svg>
